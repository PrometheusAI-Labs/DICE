version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-dice-bot
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - PORT=${PORT:-5000}
      - RUST_LOG=${RUST_LOG}
    restart: unless-stopped
